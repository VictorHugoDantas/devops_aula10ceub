version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: meu_postgres_homolog
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_super_secreta
      POSTGRES_DB: banco_teste
    volumes:
      - pg_dados_homolog:/var/lib/postgresql/data
    networks:
      - app-network
  app:
    image: ${REGISTRY_IMAGE:-ghcr.io/usuario/minha-api-node}:${IMAGE_TAG:-latest}
    container_name: minha_api_node_homolog
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: senha_super_secreta
      DB_NAME: banco_teste
    depends_on:
      - db
    networks:
      - app-network
volumes:
  pg_dados_homolog:
networks:
  app-network:
    driver: bridge
```[cite: 1]

Depois, clique no botão verde **Commit changes...**[cite: 2].

---

### 2. Ativar as Permissões de Escrita no GitHub (Essencial)
Para que o GitHub Actions consiga publicar a imagem no GHCR[cite: 1]:

1. Clique em **Settings** no topo do repositório[cite: 1, 2].
2. No menu lateral esquerdo, vá a **Actions** > **General**[cite: 1].
3. Na secção **Workflow permissions**, selecione **Read and write permissions**[cite: 1].
4. Clique em **Save**[cite: 1].

---

Assim que guardar, a pipeline vai disparar automaticamente! Pode acompanhar a execução no separador **Actions** no topo do repositório[cite: 1].<ElicitationsGroup>

